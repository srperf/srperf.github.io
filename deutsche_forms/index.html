<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Deutsche Forms</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    html {
      scroll-behavior: smooth;
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      background: #f4f6f8;
      color: #1a1a2e;
      line-height: 1.5;
      min-height: 100vh;
      padding: env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left);
    }

    .container {
      max-width: 600px;
      margin: 0 auto;
      padding: 0.75rem 1rem 1.5rem;
      display: flex;
      flex-direction: column;
      gap: 0.75rem;
      align-items: stretch;
    }

    header {
      text-align: center;
      padding-bottom: 0.5rem;
      border-bottom: 1px solid #e2e4e8;
      margin-bottom: 0.25rem;
    }

    h1 {
      font-size: 1.75rem;
      font-weight: 800;
      color: #0f62fe;
      margin-bottom: 0.25rem;
      letter-spacing: -0.5px;
    }

    .subtitle {
      font-size: 0.95rem;
      color: #57606a;
      margin-bottom: 0.5rem;
    }

    .nav-grid {
      display: grid;
      grid-template-columns: 1fr;
      gap: 0.75rem;
    }

    .card {
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      text-align: center;
      background: #ffffff;
      border: 2px solid #d0d5da;
      border-radius: 16px;
      padding: 1.25rem 0.75rem;
      text-decoration: none;
      color: inherit;
      transition: transform 0.1s ease, box-shadow 0.1s ease, border-color 0.1s ease;
      touch-action: manipulation;
      min-height: 110px;
    }

    .card:active {
      transform: scale(0.97);
      background-color: #f0f4f8;
    }

    .card:hover {
      border-color: #0f62fe;
      box-shadow: 0 4px 12px rgba(15, 98, 254, 0.12);
    }

    .card-number {
      font-size: 2rem;
      font-weight: 900;
      color: #0f62fe;
      margin-bottom: 0.5rem;
      line-height: 1;
    }

    .card-title {
      font-size: 1.1rem;
      font-weight: 700;
      color: #1a1a2e;
      margin-bottom: 0.3rem;
    }

    .card-desc {
      font-size: 0.85rem;
      color: #57606a;
      max-width: 80%;
      line-height: 1.4;
    }

    .footer {
      margin-top: auto;
      padding-top: 0.5rem;
      border-top: 1px solid #e2e4e8;
      text-align: center;
      font-size: 0.75rem;
      color: #8a94a6;
    }

    @media (min-width: 480px) {
      .container {
        padding: 1rem 1.5rem 2rem;
      }

      h1 {
        font-size: 2rem;
      }

      .card {
        min-height: 130px;
        padding: 1.5rem 1rem;
      }

      .card-number {
        font-size: 2.5rem;
      }

      .card-title {
        font-size: 1.35rem;
      }
    }
  </style>
</head>
<body>
  <div class="container">
    <header>
      <h1>Deutsche Forms</h1>
      <p class="subtitle">Study German — choose a section</p>
    </header>

    <nav class="nav-grid" aria-label="Section selection">
      <a href="pronouns.html" class="card">
        <span class="card-number">1</span>
        <h2 class="card-title">Pronouns by case</h2>
        <p class="card-desc">Nominative, Accusative, Dative, Genitive</p>
      </a>

      <a href="verbs.html" class="card">
        <span class="card-number">2</span>
        <h2 class="card-title">Position and motion verbs</h2>
        <p class="card-desc">legen/liegen, stehen/stellen, setzen/sitzen and more</p>
      </a>

      <a href="adjectives.html" class="card">
        <span class="card-number">3</span>
        <h2 class="card-title">Practice Adjectives</h2>
        <p class="card-desc">Choose the correct article for each case</p>
      </a>
    </nav>

    <div class="footer">
      Deutsche Forms &middot; Landing page
    </div>
  </div>
</body>
</html>
